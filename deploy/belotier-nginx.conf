server {
    server_name belotier.e1000.dev;

    root /opt/belotier/dist;
    index index.html;
    access_log /var/log/nginx/belotier.access.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # No external anything: all sound is synthesised and all art is self-hosted,
    # so the only cross-origin need is the game's own WebSocket.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss://belotier.e1000.dev; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 256;

    # Hashed build assets and pre-rendered cards never change in place.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    location /cards/ {
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # The game socket. Same upgrade pattern as the uptime-kuma vhost.
    location /ws {
        proxy_pass http://unix:/run/belotier/ws.sock;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Four players may well share one home IP, so this is deliberately loose;
        # the server itself refuses anything past MAX_SOCKETS.
        limit_conn belotier_conn 12;
    }

    location = /health {
        proxy_pass http://unix:/run/belotier/ws.sock;
        access_log off;
    }

    # The seat links (/s/nord …) are client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
